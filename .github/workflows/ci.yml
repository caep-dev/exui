name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    # Visual baselines are intentionally captured on Windows. Keep the runner
    # platform aligned because Chromium text rasterization is platform-specific.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter @exre/exui-showcase exec playwright install chromium

      - name: Validate tokens
        run: pnpm tokens:check

      - name: Type-check workspaces
        run: pnpm typecheck

      - name: Lint workspaces
        run: pnpm lint

      - name: Run visual tests
        run: pnpm test:visual

      - name: Build workspaces
        run: pnpm build

      - name: Verify packed consumers
        run: pnpm verify:pack

      - name: Verify release configuration
        run: pnpm release:verify

      - name: Test release automation
        run: pnpm test:release

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require all quality checks
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
